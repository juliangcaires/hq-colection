<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar (desktop) — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="min-height: 900px; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <div aria-hidden="true" style="flex: 1 1 480px; min-height: 280px; position: relative; overflow: hidden; background: #14111d; border-right: 1px solid #2b2540">
    <div style="position: absolute; left: -60px; right: -60px; top: -40px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; transform: rotate(-6deg)">
      <sc-for list="{{capas}}" as="c" hint-placeholder-count="30">
        <div style="aspect-ratio: 2 / 3; border-radius: 8px; background: {{c.cor}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)"></div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 48px; background: rgba(16,13,22,0.88)">
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; max-width: 520px">Saiba o que tem na estante — e o que falta nela.</div>
    </div>
  </div>

  <main style="flex: 1 1 520px; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 48px 24px; box-sizing: border-box">
    <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px">
      <div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Minha Coleção</div>
        <div style="font-size: 15px; color: #a89cc4; margin-top: 4px">Entre para ver sua coleção de HQs e mangás.</div>
      </div>

      <div role="tablist" aria-label="Acesso" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #14111d; border: 1px solid #2b2540">
        <button role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 9px; background: transparent; color: #a89cc4; font: inherit; font-size: 15px">Entrar</button>
        <button role="tab" aria-selected="true" style="height: 44px; border: 0; border-radius: 9px; background: #f1eef7; color: #100d16; font: inherit; font-size: 15px; font-weight: 600">Criar conta</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="dl-nome" style="font-size: 13px; color: #a89cc4">Nome</label>
        <input id="dl-nome" placeholder="Como quer ser chamado" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #2b2540; background: #1b1726; color: #f1eef7; font: inherit; font-size: 16px; box-sizing: border-box">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="dl-email" style="font-size: 13px; color: #a89cc4">E-mail</label>
        <input id="dl-email" type="email" placeholder="voce@email.com" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #2b2540; background: #1b1726; color: #f1eef7; font: inherit; font-size: 16px; box-sizing: border-box">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="dl-senha" style="font-size: 13px; color: #a89cc4">Senha</label>
        <input id="dl-senha" type="password" placeholder="Mínimo de 8 caracteres" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #2b2540; background: #1b1726; color: #f1eef7; font: inherit; font-size: 16px; box-sizing: border-box">
      </div>

      <a href="DesktopInicio.dc.html" style="height: 52px; border-radius: 14px; background: #8b6cf5; color: #100d16; text-decoration: none; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">Criar conta</a>
      <div style="text-align: center; font-size: 14px; color: #a89cc4">Já tem conta? <a href="#" style="font-weight: 600">Entrar</a></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var cores = ['#2a3b34', '#3a2350', '#1f3550', '#5a2a1a', '#4b1f22', '#4a3a1c', '#263a3e', '#2f2b45'];
    var capas = [];
    for (var i = 0; i < 30; i++) capas.push({ cor: cores[(i * 3 + Math.floor(i / 6)) % cores.length] });
    return { capas: capas };
  }
}
</script>
</body>
</html>
