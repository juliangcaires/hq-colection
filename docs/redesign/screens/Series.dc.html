<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Séries — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; box-sizing: border-box">

  <header style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Séries</h1>
      <span style="font-size: 13px; color: #a89cc4">31 séries</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #1b1726; border: 1px solid #2b2540; color: #a89cc4">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar série</span>
      <input type="search" placeholder="Buscar série…" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #f1eef7; font: inherit; font-size: 15px; outline: none">
    </label>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <button aria-pressed="true" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: #f1eef7; color: #100d16; font: inherit; font-size: 14px; font-weight: 600">Todas</button>
      <button aria-pressed="false" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; font: inherit; font-size: 14px">HQ</button>
      <button aria-pressed="false" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; font: inherit; font-size: 14px">Mangá</button>
      <button aria-pressed="false" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px dashed #e0912a; background: #14111d; color: #f0c48a; font: inherit; font-size: 14px">Com furos · 7</button>
    </div>
  </header>

  <ul style="list-style: none; margin: 14px 0 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{series}}" as="s" hint-placeholder-count="6">
      <li>
        <a href="Serie.dc.html" style="display: flex; gap: 14px; align-items: center; padding: 10px; border-radius: 14px; background: #14111d; border: 1px solid #2b2540; text-decoration: none; color: #f1eef7">
          <div aria-hidden="true" style="flex: none; position: relative; width: 60px; height: 72px">
            <div style="position: absolute; left: 12px; top: 0; width: 44px; aspect-ratio: 2 / 3; border-radius: 4px; background: {{s.cor}}; opacity: 0.45"></div>
            <div style="position: absolute; left: 6px; top: 3px; width: 44px; aspect-ratio: 2 / 3; border-radius: 4px; background: {{s.cor}}; opacity: 0.7"></div>
            <div style="position: absolute; left: 0; top: 6px; width: 44px; aspect-ratio: 2 / 3; border-radius: 4px; background: {{s.cor}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1)"></div>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.nome}}</span>
              <span style="flex: none; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{s.tipoCor}}; border: 1px solid {{s.tipoCor}}; border-radius: 4px; padding: 0 5px">{{s.tipo}}</span>
            </div>
            <div style="font-size: 13px; color: #a89cc4">{{s.resumo}}</div>
            <div style="height: 6px; border-radius: 3px; background: #2b2540; overflow: hidden"><div style="width: {{s.pct}}; height: 100%; background: #2fbf9a; border-radius: 3px"></div></div>
          </div>
          <sc-if value="{{s.temFuro}}" hint-placeholder-val="{{ false }}">
            <span style="flex: none; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: rgba(224,145,42,0.16); color: #f0c48a">{{s.furos}}</span>
          </sc-if>
        </a>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 6px 8px 22px; box-sizing: border-box; background: rgba(20,17,29,0.92); border-top: 1px solid #2b2540; backdrop-filter: blur(16px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #a89cc4; font-size: 11px; font-weight: 500">
      <span style="display: flex; padding: 4px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Início
    </a>
    <a href="Colecao.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #a89cc4; font-size: 11px; font-weight: 500">
      <span style="display: flex; padding: 4px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="10" rx="1"></rect><rect x="14" y="3" width="7" height="10" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect><rect x="14" y="16" width="7" height="5" rx="1"></rect></svg></span>Coleção
    </a>
    <a href="InsercaoRapida.dc.html" aria-label="Adicionar item" style="justify-self: center; width: 56px; height: 56px; border-radius: 28px; background: #8b6cf5; color: #100d16; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 6px 18px rgba(139,108,245,0.4)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="Series.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #f1eef7; font-size: 11px; font-weight: 600">
      <span style="display: flex; padding: 4px 16px; border-radius: 14px; background: rgba(139,108,245,0.22)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"></path><path d="m3 13 9 5 9-5"></path></svg></span>Séries
    </a>
    <a href="Desejos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #a89cc4; font-size: 11px; font-weight: 500">
      <span style="display: flex; padding: 4px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></span>Desejos
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var mk = function (nome, tipo, tem, total, lidos, furos, cor) {
      return {
        nome: nome, tipo: tipo, cor: cor,
        tipoCor: tipo === 'Mangá' ? '#d98ae3' : '#8fb4f0',
        resumo: tem + (total ? ' de ' + total : '') + ' na estante · ' + lidos + ' lidos',
        pct: Math.round((lidos / tem) * 100) + '%',
        temFuro: furos > 0, furos: furos === 1 ? '1 furo' : furos + ' furos'
      };
    };
    return {
      series: [
        mk('Vagabond', 'Mangá', 34, 37, 21, 3, '#2a3b34'),
        mk('Saga', 'HQ', 9, 10, 9, 1, '#1f3550'),
        mk('Chainsaw Man', 'Mangá', 12, 14, 8, 2, '#5a2a1a'),
        mk('Berserk', 'Mangá', 20, 22, 15, 2, '#4b1f22'),
        mk('Sandman — Edição Definitiva', 'HQ', 3, 4, 2, 1, '#3a2350'),
        mk('Monstro do Pântano', 'HQ', 4, 0, 1, 0, '#4a3a1c')
      ]
    };
  }
}
</script>
</body>
</html>
