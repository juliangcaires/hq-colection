<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Importar CSV — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; box-sizing: border-box">

  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 12px 0 8px">
    <a href="Main.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #f1eef7">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em">Importar CSV</h1>
  </header>

  <section style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 12px">
      <li style="display: flex; flex-direction: column; gap: 6px; color: #a89cc4"><span style="height: 4px; border-radius: 2px; background: #2fbf9a"></span>1. Arquivo</li>
      <li style="display: flex; flex-direction: column; gap: 6px; color: #f1eef7; font-weight: 600"><span style="height: 4px; border-radius: 2px; background: #8b6cf5"></span>2. Revisar</li>
      <li style="display: flex; flex-direction: column; gap: 6px; color: #a89cc4"><span style="height: 4px; border-radius: 2px; background: #2b2540"></span>3. Importar</li>
    </ol>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #14111d; border: 1px solid #2b2540">
      <span style="width: 40px; height: 40px; border-radius: 10px; background: rgba(47,191,154,0.16); color: #5fd8b6; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg>
      </span>
      <div style="flex: 1; min-width: 0">
        <div style="font-weight: 600; font-size: 15px">colecao-planilha.csv</div>
        <div style="font-size: 13px; color: #a89cc4">128 linhas · 6 colunas</div>
      </div>
      <button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #b9a6ff; font: inherit; font-size: 14px; font-weight: 600">Trocar</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 12px; border-radius: 12px; background: #14111d; border: 1px solid #2b2540"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; color: #2fbf9a">118</div><div style="font-size: 12px; color: #a89cc4">novos</div></div>
      <div style="padding: 12px; border-radius: 12px; background: #14111d; border: 1px solid #2b2540"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; color: #f0c48a">8</div><div style="font-size: 12px; color: #a89cc4">já na coleção</div></div>
      <div style="padding: 12px; border-radius: 12px; background: #14111d; border: 1px solid #2b2540"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; color: #e08a7e">2</div><div style="font-size: 12px; color: #a89cc4">com erro</div></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 700">Colunas</h2>
      <div style="background: #14111d; border: 1px solid #2b2540; border-radius: 14px; overflow: hidden">
        <sc-for list="{{colunas}}" as="c" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; min-height: 52px; box-sizing: border-box; border-top: {{c.borda}}">
            <code style="flex: 1; min-width: 0; font-size: 13px; color: #a89cc4">{{c.csv}}</code>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a89cc4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            <button style="flex: 0 0 132px; height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #2b2540; background: #1b1726; color: #f1eef7; font: inherit; font-size: 14px; text-align: left">{{c.campo}} ▾</button>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="padding: 12px; border-radius: 12px; border: 1px solid rgba(209,106,92,0.5); background: rgba(209,106,92,0.08); font-size: 13px; color: #f1c1ba">Linhas 47 e 92 sem título — serão ignoradas. <a href="#" style="color: #f1c1ba; font-weight: 600">Ver linhas</a></div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #100d16; border-top: 1px solid #2b2540">
    <button style="width: 100%; height: 52px; border-radius: 14px; border: 0; background: #8b6cf5; color: #100d16; font: inherit; font-size: 16px; font-weight: 700">Importar 118 itens</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = [['titulo', 'Título'], ['serie', 'Série'], ['numero', 'Número'], ['status', 'Estado']];
    return {
      colunas: d.map(function (x, i) { return { csv: x[0], campo: x[1], borda: i === 0 ? '0' : '1px solid #2b2540' }; })
    };
  }
}
</script>
</body>
</html>
