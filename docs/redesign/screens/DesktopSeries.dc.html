<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Séries (desktop) — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="min-height: 900px; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #2b2540; background: #14111d; display: flex; flex-direction: column; gap: 20px">
    <div style="padding: 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Minha Coleção</div>
    <a href="DesktopInsercaoRapida.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 12px; background: #8b6cf5; color: #100d16; text-decoration: none; font-weight: 700; font-size: 15px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Adicionar item</a>
    <nav aria-label="Navegação principal" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DesktopInicio.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>
      <a href="DesktopColecao.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="10" rx="1"></rect><rect x="14" y="3" width="7" height="10" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect><rect x="14" y="16" width="7" height="5" rx="1"></rect></svg>Coleção<span style="margin-left: auto; font-size: 12px">248</span></a>
      <a href="DesktopSeries.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: rgba(139,108,245,0.18); color: #f1eef7; text-decoration: none; font-weight: 600; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"></path><path d="m3 13 9 5 9-5"></path></svg>Séries<span style="margin-left: auto; font-size: 12px; font-weight: 500">31</span></a>
      <a href="DesktopDesejos.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>Desejos<span style="margin-left: auto; font-size: 12px">12</span></a>
    </nav>
    <div style="height: 1px; background: #2b2540"></div>
    <nav aria-label="Ferramentas" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DesktopTags.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path><circle cx="8" cy="8" r="1.5"></circle></svg>Tags</a>
      <a href="DesktopImportar.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg>Importar CSV</a>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #1b1726; border: 1px solid #2b2540; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 13px">CM</span>
      <span style="font-size: 14px; color: #a89cc4">Minha conta</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 40px 40px">
    <div style="max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Séries <span style="font-size: 18px; font-weight: 600; color: #a89cc4">31</span></h1>
        <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; font: inherit; font-size: 14px; font-weight: 600">+ Nova série</button>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; background: #14111d; border: 1px solid #2b2540">
        <label style="flex: 1 1 280px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 10px; background: #1b1726; border: 1px solid #2b2540; color: #a89cc4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar série</span>
          <input type="search" placeholder="Buscar série…" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; color: #f1eef7; font: inherit; font-size: 15px; outline: none">
        </label>
        <button aria-pressed="true" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: #f1eef7; color: #100d16; font: inherit; font-size: 14px; font-weight: 600">Todas</button>
        <button aria-pressed="false" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 14px">HQ</button>
        <button aria-pressed="false" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 14px">Mangá</button>
        <button aria-pressed="false" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px dashed #e0912a; background: transparent; color: #f0c48a; font: inherit; font-size: 14px">Com furos · 7</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px">
        <sc-for list="{{series}}" as="s" hint-placeholder-count="9">
          <a href="DesktopSerie.dc.html" style="display: flex; gap: 16px; align-items: center; padding: 14px; border-radius: 14px; background: #14111d; border: 1px solid #2b2540; text-decoration: none; color: #f1eef7">
            <div aria-hidden="true" style="flex: none; position: relative; width: 78px; height: 96px">
              <div style="position: absolute; left: 18px; top: 0; width: 58px; aspect-ratio: 2 / 3; border-radius: 5px; background: {{s.cor}}; opacity: 0.45"></div>
              <div style="position: absolute; left: 9px; top: 4px; width: 58px; aspect-ratio: 2 / 3; border-radius: 5px; background: {{s.cor}}; opacity: 0.7"></div>
              <div style="position: absolute; left: 0; top: 8px; width: 58px; aspect-ratio: 2 / 3; border-radius: 5px; background: {{s.cor}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1)"></div>
            </div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; align-items: center; gap: 8px">
                <span style="font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.nome}}</span>
                <span style="flex: none; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{s.tipoCor}}; border: 1px solid {{s.tipoCor}}; border-radius: 4px; padding: 0 5px">{{s.tipo}}</span>
              </div>
              <div style="font-size: 13px; color: #a89cc4">{{s.resumo}}</div>
              <div style="height: 6px; border-radius: 3px; background: #2b2540; overflow: hidden"><div style="width: {{s.pct}}; height: 100%; background: #2fbf9a; border-radius: 3px"></div></div>
              <sc-if value="{{s.temFuro}}" hint-placeholder-val="{{ false }}">
                <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: rgba(224,145,42,0.16); color: #f0c48a">{{s.furos}}</span>
              </sc-if>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var mk = function (nome, tipo, tem, total, lidos, furos, cor) {
      return {
        nome: nome, tipo: tipo, cor: cor,
        tipoCor: tipo === 'Mangá' ? '#d98ae3' : '#8fb4f0',
        resumo: tem + (total ? ' de ' + total : '') + ' na estante · ' + lidos + ' lidos',
        pct: Math.round((lidos / tem) * 100) + '%',
        temFuro: furos > 0, furos: furos === 1 ? 'Falta 1 volume' : 'Faltam ' + furos + ' volumes'
      };
    };
    return {
      series: [
        mk('Vagabond', 'Mangá', 34, 37, 21, 3, '#2a3b34'),
        mk('Saga', 'HQ', 9, 10, 9, 1, '#1f3550'),
        mk('Chainsaw Man', 'Mangá', 12, 14, 8, 2, '#5a2a1a'),
        mk('Berserk', 'Mangá', 20, 22, 15, 2, '#4b1f22'),
        mk('Sandman — Edição Definitiva', 'HQ', 3, 4, 2, 1, '#3a2350'),
        mk('Monstro do Pântano', 'HQ', 4, 0, 1, 0, '#4a3a1c'),
        mk('Vinland Saga', 'Mangá', 14, 14, 14, 0, '#263a3e'),
        mk('Hellboy', 'HQ', 7, 0, 7, 0, '#5a2a1a'),
        mk('Monster', 'Mangá', 9, 9, 4, 0, '#2f2b45')
      ]
    };
  }
}
</script>
</body>
</html>
