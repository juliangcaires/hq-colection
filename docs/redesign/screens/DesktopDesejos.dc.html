<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Desejos (desktop) — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="min-height: 900px; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #2b2540; background: #14111d; display: flex; flex-direction: column; gap: 20px">
    <div style="padding: 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Minha Coleção</div>
    <a href="DesktopInsercaoRapida.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 12px; background: #8b6cf5; color: #100d16; text-decoration: none; font-weight: 700; font-size: 15px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Adicionar item</a>
    <nav aria-label="Navegação principal" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DesktopInicio.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>
      <a href="DesktopColecao.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="10" rx="1"></rect><rect x="14" y="3" width="7" height="10" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect><rect x="14" y="16" width="7" height="5" rx="1"></rect></svg>Coleção<span style="margin-left: auto; font-size: 12px">248</span></a>
      <a href="DesktopSeries.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"></path><path d="m3 13 9 5 9-5"></path></svg>Séries<span style="margin-left: auto; font-size: 12px">31</span></a>
      <a href="DesktopDesejos.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: rgba(139,108,245,0.18); color: #f1eef7; text-decoration: none; font-weight: 600; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>Desejos<span style="margin-left: auto; font-size: 12px; font-weight: 500">12</span></a>
    </nav>
    <div style="height: 1px; background: #2b2540"></div>
    <nav aria-label="Ferramentas" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DesktopTags.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path><circle cx="8" cy="8" r="1.5"></circle></svg>Tags</a>
      <a href="DesktopImportar.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg>Importar CSV</a>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #1b1726; border: 1px solid #2b2540; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 13px">CM</span>
      <span style="font-size: 14px; color: #a89cc4">Minha conta</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 40px 40px">
    <div style="max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Desejos</h1>
        <div style="display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-radius: 14px; border: 1px dashed #e0912a; background: rgba(224,145,42,0.08)">
          <span style="font-size: 14px; color: #a89cc4">12 itens · total</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; color: #f0c48a">R$ 312,40</span>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button aria-pressed="true" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: #f1eef7; color: #100d16; font: inherit; font-size: 14px; font-weight: 600">Todas as prioridades</button>
        <button aria-pressed="false" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; font: inherit; font-size: 14px">Alta (5)</button>
        <button aria-pressed="false" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; font: inherit; font-size: 14px">Furos de série (6)</button>
        <button aria-pressed="false" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; font: inherit; font-size: 14px">Até R$ 40</button>
      </div>

      <div style="overflow-x: auto; border: 1px solid #2b2540; border-radius: 14px; background: #14111d">
        <table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 15px">
          <thead>
            <tr style="text-align: left; font-size: 13px; color: #a89cc4">
              <th scope="col" style="padding: 12px 16px; font-weight: 500">Item</th>
              <th scope="col" style="padding: 12px 16px; font-weight: 500">Série</th>
              <th scope="col" style="padding: 12px 16px; font-weight: 500">Prioridade ▾</th>
              <th scope="col" style="padding: 12px 16px; font-weight: 500; text-align: right">Preço</th>
              <th scope="col" style="padding: 12px 16px; font-weight: 500; text-align: right"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ações</span></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{lista}}" as="d" hint-placeholder-count="7">
              <tr style="border-top: 1px solid #2b2540">
                <td style="padding: 10px 16px">
                  <div style="display: flex; align-items: center; gap: 12px">
                    <div style="flex: none; width: 36px; aspect-ratio: 2 / 3; border-radius: 4px; border: 2px dashed #e0912a; background: {{d.cor}}; opacity: 0.7; box-sizing: border-box"></div>
                    <span style="font-weight: 600">{{d.titulo}}</span>
                  </div>
                </td>
                <td style="padding: 10px 16px; color: #a89cc4">{{d.serie}}</td>
                <td style="padding: 10px 16px"><span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 4px; color: {{d.pTinta}}; background: {{d.pFundo}}">{{d.prioridade}}</span></td>
                <td style="padding: 10px 16px; text-align: right; font-variant-numeric: tabular-nums">{{d.preco}}</td>
                <td style="padding: 10px 16px; text-align: right">
                  <button style="height: 40px; min-width: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2fbf9a; background: transparent; color: #5fd8b6; font: inherit; font-size: 14px; font-weight: 600">Adquirir</button>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var P = {
      Alta: { pTinta: '#100d16', pFundo: '#e0912a' },
      'Média': { pTinta: '#f0c48a', pFundo: 'rgba(224,145,42,0.16)' },
      Baixa: { pTinta: '#a89cc4', pFundo: '#2b2540' }
    };
    var mk = function (titulo, serie, prioridade, preco, cor) {
      return Object.assign({ titulo: titulo, serie: serie, prioridade: prioridade, preco: preco, cor: cor }, P[prioridade]);
    };
    return {
      lista: [
        mk('Vagabond #4', 'Vagabond', 'Alta', 'R$ 39,90', '#2a3b34'),
        mk('Vagabond #17', 'Vagabond', 'Alta', 'R$ 39,90', '#263a3e'),
        mk('Vagabond #22', 'Vagabond', 'Alta', 'R$ 39,90', '#2d3a2a'),
        mk('Saga #7', 'Saga', 'Alta', 'R$ 54,90', '#1f3550'),
        mk('Chainsaw Man #9', 'Chainsaw Man', 'Média', 'R$ 32,90', '#5a2a1a'),
        mk('Sandman — Edição Definitiva 4', 'Sandman', 'Média', 'R$ 129,90', '#3a2350'),
        mk('Berserk #16', 'Berserk', 'Baixa', 'R$ 44,90', '#4b1f22')
      ]
    };
  }
}
</script>
</body>
</html>
