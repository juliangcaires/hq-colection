<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Início — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; box-sizing: border-box">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px 20px">
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Minha Coleção</div>
    <div style="display: flex; gap: 4px">
      <button aria-label="Buscar na coleção" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #f1eef7; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
      <a href="MenuConta.dc.html" aria-label="Conta, tags e importar CSV" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #2b2540; background: #1b1726; color: #f1eef7; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 14px">CM</a>
    </div>
  </header>

  <section style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #14111d; border: 1px solid #2b2540; border-radius: 14px; padding: 12px">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">248</div>
        <div style="font-size: 12px; color: #a89cc4; margin-top: 6px">na estante</div>
      </div>
      <div style="background: #14111d; border: 1px solid #2b2540; border-radius: 14px; padding: 12px">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; color: #2fbf9a">186</div>
        <div style="font-size: 12px; color: #a89cc4; margin-top: 6px">lidos</div>
      </div>
      <div style="background: #14111d; border: 1px dashed #e0912a; border-radius: 14px; padding: 12px">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; color: #e0912a">12</div>
        <div style="font-size: 12px; color: #a89cc4; margin-top: 6px">desejos</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #a89cc4">Progresso de leitura</span><span style="font-weight: 600">75%</span></div>
      <div style="height: 8px; border-radius: 4px; background: #2b2540; overflow: hidden"><div style="width: 75%; height: 100%; background: #2fbf9a; border-radius: 4px"></div></div>
    </div>
  </section>

  <section style="padding: 22px 0 0">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px 10px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">Na fila de leitura</h2>
      <a href="Colecao.dc.html" style="font-size: 13px; font-weight: 500; padding: 12px 0">Ver tudo</a>
    </div>
    <div style="display: flex; gap: 12px; padding: 0 20px; overflow: hidden">
      <sc-for list="{{fila}}" as="c" hint-placeholder-count="4">
        <div style="flex: 0 0 112px; display: flex; flex-direction: column; gap: 6px">
          <div style="width: 112px; aspect-ratio: 2 / 3; border-radius: 8px; background: {{c.cor}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
            <span style="align-self: flex-start; font-size: 11px; font-weight: 600; background: rgba(16,13,22,0.72); color: #f1eef7; padding: 2px 6px; border-radius: 4px">#{{c.vol}}</span>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15px; line-height: 1.05; color: {{c.tinta}}">{{c.titulo}}</span>
          </div>
          <div style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.titulo}}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding: 22px 20px 0">
    <h2 style="margin: 0 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">Furos nas séries</h2>
    <div style="background: #14111d; border: 1px solid #2b2540; border-radius: 14px; overflow: hidden">
      <sc-for list="{{furos}}" as="f" hint-placeholder-count="3">
        <a href="Serie.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 56px; box-sizing: border-box; border-top: {{f.borda}}; text-decoration: none; color: #f1eef7">
          <div style="width: 30px; aspect-ratio: 2 / 3; border-radius: 4px; background: {{f.cor}}; flex: none"></div>
          <div style="flex: 1; min-width: 0">
            <div style="font-weight: 600; font-size: 15px">{{f.serie}}</div>
            <div style="font-size: 13px; color: #e0912a">{{f.falta}}</div>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89cc4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </div>
  </section>

  <section style="padding: 22px 20px 0">
    <h2 style="margin: 0 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">Chegaram agora</h2>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{recentes}}" as="r" hint-placeholder-count="4">
        <div style="aspect-ratio: 2 / 3; border-radius: 6px; background: {{r.cor}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)"></div>
      </sc-for>
    </div>
  </section>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 6px 8px 22px; box-sizing: border-box; background: rgba(20,17,29,0.92); border-top: 1px solid #2b2540; backdrop-filter: blur(16px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #f1eef7; font-size: 11px; font-weight: 600">
      <span style="display: flex; padding: 4px 16px; border-radius: 14px; background: rgba(139,108,245,0.22)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Início
    </a>
    <a href="Colecao.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #a89cc4; font-size: 11px; font-weight: 500">
      <span style="display: flex; padding: 4px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="10" rx="1"></rect><rect x="14" y="3" width="7" height="10" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect><rect x="14" y="16" width="7" height="5" rx="1"></rect></svg></span>Coleção
    </a>
    <a href="InsercaoRapida.dc.html" aria-label="Adicionar item" style="justify-self: center; width: 56px; height: 56px; border-radius: 28px; background: #8b6cf5; color: #100d16; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 6px 18px rgba(139,108,245,0.4)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="Series.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #a89cc4; font-size: 11px; font-weight: 500">
      <span style="display: flex; padding: 4px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"></path><path d="m3 13 9 5 9-5"></path></svg></span>Séries
    </a>
    <a href="Desejos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #a89cc4; font-size: 11px; font-weight: 500">
      <span style="display: flex; padding: 4px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></span>Desejos
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      fila: [
        { titulo: 'Vagabond', vol: 24, cor: '#2a3b34', tinta: '#e7efe9' },
        { titulo: 'Sandman', vol: 3, cor: '#3a2350', tinta: '#efe4f7' },
        { titulo: 'Monstro do Pântano', vol: 2, cor: '#4a3a1c', tinta: '#f5ecd6' },
        { titulo: 'Berserk', vol: 15, cor: '#4b1f22', tinta: '#f6e2e0' }
      ],
      furos: [
        { serie: 'Vagabond', falta: 'Faltam #4, #17 e #22', cor: '#2a3b34', borda: '0' },
        { serie: 'Saga', falta: 'Falta o #7', cor: '#1f3550', borda: '1px solid #2b2540' },
        { serie: 'Chainsaw Man', falta: 'Faltam #9 e #10', cor: '#5a2a1a', borda: '1px solid #2b2540' }
      ],
      recentes: [
        { cor: '#1f3550' }, { cor: '#5a2a1a' }, { cor: '#3a2350' }, { cor: '#2f2b45' }
      ]
    };
  }
}
</script>
</body>
</html>
