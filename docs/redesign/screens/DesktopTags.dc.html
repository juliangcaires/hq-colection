<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tags (desktop) — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="min-height: 900px; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #2b2540; background: #14111d; display: flex; flex-direction: column; gap: 20px">
    <div style="padding: 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Minha Coleção</div>
    <a href="DesktopInsercaoRapida.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 12px; background: #8b6cf5; color: #100d16; text-decoration: none; font-weight: 700; font-size: 15px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Adicionar item</a>
    <nav aria-label="Navegação principal" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DesktopInicio.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>
      <a href="DesktopColecao.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="10" rx="1"></rect><rect x="14" y="3" width="7" height="10" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect><rect x="14" y="16" width="7" height="5" rx="1"></rect></svg>Coleção<span style="margin-left: auto; font-size: 12px">248</span></a>
      <a href="DesktopSeries.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"></path><path d="m3 13 9 5 9-5"></path></svg>Séries<span style="margin-left: auto; font-size: 12px">31</span></a>
      <a href="DesktopDesejos.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>Desejos<span style="margin-left: auto; font-size: 12px">12</span></a>
    </nav>
    <div style="height: 1px; background: #2b2540"></div>
    <nav aria-label="Ferramentas" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DesktopTags.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: rgba(139,108,245,0.18); color: #f1eef7; text-decoration: none; font-weight: 600; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path><circle cx="8" cy="8" r="1.5"></circle></svg>Tags</a>
      <a href="DesktopImportar.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg>Importar CSV</a>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #1b1726; border: 1px solid #2b2540; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 13px">CM</span>
      <span style="font-size: 14px; color: #a89cc4">Minha conta</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 40px 40px">
    <div style="max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
      <div>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Tags</h1>
        <div style="font-size: 15px; color: #a89cc4; margin-top: 4px">Tags aplicadas a uma série são herdadas por todos os volumes dela.</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; align-items: start">
        <sc-for list="{{grupos}}" as="g" hint-placeholder-count="2">
          <section style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: #14111d; border: 1px solid #2b2540">
            <div style="display: flex; align-items: center; gap: 10px">
              <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px; font-weight: 700">{{g.titulo}}</h2>
              <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{g.cor}}; border: 1px solid {{g.cor}}; border-radius: 4px; padding: 0 5px">{{g.qtd}}</span>
            </div>
            <form style="display: flex; gap: 8px">
              <label style="flex: 1; min-width: 0; display: flex">
                <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nova tag de {{g.titulo}}</span>
                <input placeholder="{{g.placeholder}}" style="flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #2b2540; background: #1b1726; color: #f1eef7; font: inherit; font-size: 15px; box-sizing: border-box">
              </label>
              <button style="flex: none; height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: #8b6cf5; color: #100d16; font: inherit; font-size: 14px; font-weight: 700">Criar</button>
            </form>
            <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
              <sc-for list="{{g.tags}}" as="t" hint-placeholder-count="5">
                <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #2b2540">
                  <span style="width: 10px; height: 10px; border-radius: 5px; background: {{t.cor}}; flex: none"></span>
                  <span style="flex: 1; min-width: 0; font-weight: 600; font-size: 15px">{{t.nome}}</span>
                  <span style="font-size: 13px; color: #a89cc4">{{t.uso}}</span>
                  <button aria-label="Renomear {{t.nome}}" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #a89cc4; display: flex; align-items: center; justify-content: center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
                  <button aria-label="Excluir {{t.nome}}" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #e08a7e; display: flex; align-items: center; justify-content: center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
                </li>
              </sc-for>
            </ul>
          </section>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var cores = ['#8b6cf5', '#2fbf9a', '#c85fd6', '#e0912a', '#d16a5c', '#8fb4f0'];
    var mk = function (lista) {
      return lista.map(function (d, i) { return { nome: d[0], uso: d[1], cor: cores[i % cores.length] }; });
    };
    return {
      grupos: [
        { titulo: 'HQ', cor: '#8fb4f0', qtd: '6 tags', placeholder: 'Nova tag de HQ…', tags: mk([
          ['super-herói', '62 volumes'], ['terror', '18 volumes'], ['Vertigo', '24 volumes'],
          ['encadernado', '40 volumes'], ['releitura', '3 volumes'], ['emprestado', '1 volume']
        ]) },
        { titulo: 'Mangá', cor: '#d98ae3', qtd: '8 tags', placeholder: 'Nova tag de mangá…', tags: mk([
          ['seinen', '92 volumes'], ['shounen', '48 volumes'], ['samurai', '34 volumes'],
          ['fantasia sombria', '20 volumes'], ['finalizada', '26 volumes'], ['releitura', '7 volumes']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
