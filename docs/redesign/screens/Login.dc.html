<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; box-sizing: border-box; display: flex; flex-direction: column">

  <div aria-hidden="true" style="height: 250px; position: relative; overflow: hidden; border-bottom: 1px solid #2b2540">
    <div style="position: absolute; left: -30px; right: -30px; top: 24px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; transform: rotate(-6deg)">
      <sc-for list="{{capas}}" as="c" hint-placeholder-count="12">
        <div style="aspect-ratio: 2 / 3; border-radius: 6px; background: {{c.cor}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)"></div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: #100d16; opacity: 0.85"></div>
  </div>

  <section style="flex: 1; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 18px">
    <div>
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Minha Coleção</div>
      <div style="font-size: 15px; color: #a89cc4; margin-top: 4px">Sua estante de HQs e mangás, no bolso.</div>
    </div>

    <div role="tablist" aria-label="Acesso" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #14111d; border: 1px solid #2b2540">
      <button role="tab" aria-selected="true" style="height: 44px; border: 0; border-radius: 9px; background: #f1eef7; color: #100d16; font: inherit; font-size: 15px; font-weight: 600">Entrar</button>
      <button role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 9px; background: transparent; color: #a89cc4; font: inherit; font-size: 15px">Criar conta</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="l-email" style="font-size: 13px; color: #a89cc4">E-mail</label>
      <input id="l-email" type="email" placeholder="voce@email.com" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #2b2540; background: #1b1726; color: #f1eef7; font: inherit; font-size: 16px; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <label for="l-senha" style="font-size: 13px; color: #a89cc4">Senha</label>
        <a href="#" style="font-size: 13px; padding: 12px 0">Esqueci a senha</a>
      </div>
      <input id="l-senha" type="password" value="••••••••" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #2b2540; background: #1b1726; color: #f1eef7; font: inherit; font-size: 16px; box-sizing: border-box">
    </div>

    <a href="Main.dc.html" style="margin-top: auto; height: 52px; border-radius: 14px; background: #8b6cf5; color: #100d16; text-decoration: none; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">Entrar</a>
    <div style="text-align: center; font-size: 14px; color: #a89cc4">Primeira vez aqui? <a href="#" style="font-weight: 600">Crie sua conta</a></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cores = ['#2a3b34', '#3a2350', '#1f3550', '#5a2a1a', '#4b1f22', '#4a3a1c', '#263a3e', '#2f2b45'];
    var capas = [];
    for (var i = 0; i < 12; i++) capas.push({ cor: cores[(i * 3) % cores.length] });
    return { capas: capas };
  }
}
</script>
</body>
</html>
