<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Inserção rápida (desktop) — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="min-height: 900px; position: relative; overflow: hidden; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex">
    <div style="flex: 0 0 232px; background: #14111d; border-right: 1px solid #2b2540"></div>
    <div style="flex: 1; padding: 120px 40px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 18px; align-content: start">
      <sc-for list="{{fundo}}" as="f" hint-placeholder-count="12">
        <div style="aspect-ratio: 2 / 3; border-radius: 8px; background: {{f.cor}}"></div>
      </sc-for>
    </div>
  </div>
  <a href="DesktopInicio.dc.html" aria-label="Fechar" style="position: absolute; inset: 0; background: rgba(8,6,12,0.74)"></a>

  <section role="dialog" aria-modal="true" aria-labelledby="dqa-title" style="position: relative; width: 100%; max-width: 560px; box-sizing: border-box; padding: 24px; border-radius: 20px; background: #14111d; border: 1px solid #3a3256; box-shadow: 0 24px 64px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 id="dqa-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Adicionar rápido</h2>
      <a href="DesktopInicio.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #a89cc4">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="dqa-serie" style="font-size: 13px; color: #a89cc4">Série</label>
      <input id="dqa-serie" value="Vagabond" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #8b6cf5; background: #1b1726; color: #f1eef7; font: inherit; font-size: 16px; outline: none; box-sizing: border-box">
      <div style="font-size: 13px; color: #a89cc4">Mangá · numerada · último na estante: <span style="color: #f1eef7; font-weight: 600">#25</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span id="dqa-vol" style="font-size: 13px; color: #a89cc4">Volume — próximo da sequência e furos primeiro</span>
      <div role="group" aria-labelledby="dqa-vol" style="display: flex; gap: 8px; flex-wrap: wrap">
        <button aria-pressed="true" style="height: 44px; min-width: 64px; padding: 0 14px; border-radius: 10px; border: 0; background: #f1eef7; color: #100d16; font: inherit; font-size: 15px; font-weight: 700">#26</button>
        <button aria-pressed="false" style="height: 44px; min-width: 64px; padding: 0 14px; border-radius: 10px; border: 2px dashed #e0912a; background: transparent; color: #f0c48a; font: inherit; font-size: 15px; font-weight: 600">#4</button>
        <button aria-pressed="false" style="height: 44px; min-width: 64px; padding: 0 14px; border-radius: 10px; border: 2px dashed #e0912a; background: transparent; color: #f0c48a; font: inherit; font-size: 15px; font-weight: 600">#17</button>
        <button aria-pressed="false" style="height: 44px; min-width: 64px; padding: 0 14px; border-radius: 10px; border: 2px dashed #e0912a; background: transparent; color: #f0c48a; font: inherit; font-size: 15px; font-weight: 600">#22</button>
        <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #2b2540; color: #a89cc4; font-size: 14px">Intervalo
          <input placeholder="26–30" style="width: 64px; height: 32px; border: 0; background: transparent; color: #f1eef7; font: inherit; font-size: 15px; outline: none"></label>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span id="dqa-estado" style="font-size: 13px; color: #a89cc4">Estado</span>
      <div role="group" aria-labelledby="dqa-estado" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #100d16; border: 1px solid #2b2540">
        <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 9px; background: transparent; color: #a89cc4; font: inherit; font-size: 14px">Desejo</button>
        <button aria-pressed="true" style="height: 44px; border: 0; border-radius: 9px; background: #8b6cf5; color: #100d16; font: inherit; font-size: 14px; font-weight: 700">Comprado</button>
        <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 9px; background: transparent; color: #a89cc4; font: inherit; font-size: 14px">Lido</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; padding-top: 6px">
      <span style="margin-right: auto; font-size: 13px; color: #a89cc4"><kbd style="font: inherit; border: 1px solid #2b2540; border-radius: 4px; padding: 1px 6px">Enter</kbd> adiciona e continua</span>
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 15px">Adicionar e continuar</button>
      <button style="height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: #8b6cf5; color: #100d16; font: inherit; font-size: 15px; font-weight: 700">Adicionar #26</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var cores = ['#2a3b34', '#3a2350', '#1f3550', '#5a2a1a', '#4b1f22', '#4a3a1c'];
    var fundo = [];
    for (var i = 0; i < 14; i++) fundo.push({ cor: cores[i % cores.length] });
    return { fundo: fundo };
  }
}
</script>
</body>
</html>
