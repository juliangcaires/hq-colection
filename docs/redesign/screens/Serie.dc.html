<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Série Vagabond — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; box-sizing: border-box">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 0">
    <a href="Main.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #f1eef7">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <button style="height: 44px; padding: 0 14px; border: 0; background: transparent; color: #b9a6ff; font: inherit; font-size: 15px; font-weight: 600">Cancelar</button>
  </header>

  <section style="display: flex; gap: 16px; padding: 4px 20px 0">
    <div style="flex: none; width: 92px; aspect-ratio: 2 / 3; border-radius: 8px; background: #2a3b34; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)"></div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
      <span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #c85fd6; border: 1px solid #c85fd6; border-radius: 4px; padding: 1px 6px">Mangá</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: -0.02em">Vagabond</h1>
      <div style="font-size: 13px; color: #a89cc4">37 volumes · 34 na estante · 21 lidos</div>
      <div style="display: flex; gap: 2px; height: 8px; margin-top: 4px">
        <div style="flex: 21; background: #2fbf9a; border-radius: 4px 0 0 4px"></div>
        <div style="flex: 13; background: #8b6cf5"></div>
        <div style="flex: 3; background: transparent; border: 1px dashed #e0912a; border-radius: 0 4px 4px 0; box-sizing: border-box"></div>
      </div>
      <div style="display: flex; gap: 12px; font-size: 12px; color: #a89cc4">
        <span><span style="color: #2fbf9a">●</span> Lidos</span><span><span style="color: #8b6cf5">●</span> Na fila</span><span><span style="color: #e0912a">●</span> Faltando</span>
      </div>
    </div>
  </section>

  <section style="margin: 16px 20px 0; padding: 12px; border-radius: 14px; background: rgba(224,145,42,0.1); border: 1px solid rgba(224,145,42,0.45); display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; min-width: 0">
      <div style="font-weight: 600; font-size: 15px">3 furos na série</div>
      <div style="font-size: 13px; color: #f0c48a">Faltam #4, #17 e #22</div>
    </div>
    <button style="flex: none; height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: #e0912a; color: #100d16; font: inherit; font-size: 14px; font-weight: 600">+ Desejos</button>
  </section>

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 18px 20px 10px">
    <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">Volumes</h2>
    <span style="font-size: 13px; color: #a89cc4">Toque para selecionar</span>
  </div>

  <div style="padding: 0 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{vols}}" as="v" hint-placeholder-count="20">
      <div style="position: relative">
        <sc-if value="{{v.falta}}" hint-placeholder-val="{{ false }}">
          <button aria-label="Volume {{v.n}} faltando, adicionar" style="width: 100%; aspect-ratio: 2 / 3; border-radius: 6px; border: 2px dashed #e0912a; background: transparent; color: #e0912a; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">#{{v.n}}</span>
            <span style="font-size: 10px; font-weight: 600">falta</span>
          </button>
        </sc-if>
        <sc-if value="{{v.tem}}" hint-placeholder-val="{{ true }}">
          <button aria-pressed="{{v.selStr}}" aria-label="Volume {{v.n}}" style="width: 100%; aspect-ratio: 2 / 3; border-radius: 6px; border: 0; background: {{v.cor}}; box-shadow: {{v.ring}}; color: #f1eef7; font: inherit; padding: 4px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 14px; background: rgba(16,13,22,0.7); border-radius: 3px; padding: 0 4px">{{v.n}}</span>
          </button>
          <sc-if value="{{v.sel}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="position: absolute; top: -5px; right: -5px; width: 22px; height: 22px; border-radius: 11px; background: #8b6cf5; color: #100d16; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #100d16">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
            </span>
          </sc-if>
          <sc-if value="{{v.lido}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="position: absolute; top: 4px; left: 4px; width: 8px; height: 8px; border-radius: 4px; background: #2fbf9a; box-shadow: 0 0 0 2px #100d16"></span>
          </sc-if>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 24px; padding: 10px 10px 10px 16px; border-radius: 18px; background: #1b1726; border: 1px solid #3a3256; box-shadow: 0 12px 32px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 6px">
    <span style="flex: 1; font-weight: 600; font-size: 15px">4 selecionados</span>
    <button style="height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: #2fbf9a; color: #100d16; font: inherit; font-size: 14px; font-weight: 600">Marcar lido</button>
    <button aria-label="Editar tags dos selecionados" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path><circle cx="8" cy="8" r="1.5"></circle></svg>
    </button>
    <button aria-label="Excluir selecionados" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2b2540; background: #14111d; color: #e08a7e; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cores = ['#2a3b34', '#263a3e', '#2d3a2a', '#33392a', '#2a3442'];
    var faltam = { 4: 1, 17: 1, 22: 1 };
    var sel = { 12: 1, 13: 1, 14: 1, 15: 1 };
    var vols = [];
    for (var n = 1; n <= 25; n++) {
      var falta = !!faltam[n];
      var s = !!sel[n];
      vols.push({
        n: n, falta: falta, tem: !falta, sel: s, selStr: s ? 'true' : 'false',
        lido: !falta && n <= 11,
        cor: cores[n % cores.length],
        ring: s ? '0 0 0 2px #100d16, 0 0 0 4px #8b6cf5' : 'inset 0 0 0 1px rgba(255,255,255,0.08)'
      });
    }
    return { vols: vols };
  }
}
</script>
</body>
</html>
