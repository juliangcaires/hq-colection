<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Coleção — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; box-sizing: border-box">

  <header style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Coleção</h1>
      <span style="font-size: 13px; color: #a89cc4">248 itens</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #1b1726; border: 1px solid #2b2540; color: #a89cc4">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar na coleção</span>
      <input type="search" placeholder="Buscar título, série, autor…" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #f1eef7; font: inherit; font-size: 15px; outline: none">
    </label>
    <div role="group" aria-label="Tipo" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #14111d; border: 1px solid #2b2540">
      <button aria-pressed="true" style="height: 40px; border: 0; border-radius: 9px; background: #f1eef7; color: #100d16; font: inherit; font-size: 14px; font-weight: 600">Todos</button>
      <button aria-pressed="false" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: #a89cc4; font: inherit; font-size: 14px; font-weight: 500">HQ</button>
      <button aria-pressed="false" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: #a89cc4; font: inherit; font-size: 14px; font-weight: 500">Mangá</button>
    </div>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <button style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8b6cf5; background: rgba(139,108,245,0.16); color: #f1eef7; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px">Série: Vagabond
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      <button style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 6px">Tags
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 6px">Estado
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: #14111d; color: #f1eef7; font: inherit; font-size: 14px">Ordenar</button>
    </div>
  </header>

  <div style="padding: 16px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 12px; row-gap: 14px">
    <sc-for list="{{itens}}" as="c" hint-placeholder-count="9">
      <a href="Item.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #f1eef7; opacity: {{c.op}}">
        <div style="position: relative; aspect-ratio: 2 / 3; border-radius: 8px; background: {{c.cor}}; border: {{c.borda}}; box-sizing: border-box; padding: 7px; display: flex; flex-direction: column; justify-content: flex-end">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 14px; line-height: 1.05; color: #f1eef7">{{c.titulo}}</span>
          <sc-if value="{{c.lido}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; background: #d16a5c; color: #100d16">Lido</span>
          </sc-if>
          <sc-if value="{{c.desejo}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; background: #e0912a; color: #100d16">Desejo</span>
          </sc-if>
        </div>
        <div style="font-size: 13px; line-height: 1.25"><span style="font-weight: 600">#{{c.vol}}</span> <span style="color: #a89cc4">{{c.serie}}</span></div>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 6px 8px 22px; box-sizing: border-box; background: rgba(20,17,29,0.92); border-top: 1px solid #2b2540; backdrop-filter: blur(16px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #a89cc4; font-size: 11px; font-weight: 500">
      <span style="display: flex; padding: 4px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Início
    </a>
    <a href="Colecao.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #f1eef7; font-size: 11px; font-weight: 600">
      <span style="display: flex; padding: 4px 16px; border-radius: 14px; background: rgba(139,108,245,0.22)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="10" rx="1"></rect><rect x="14" y="3" width="7" height="10" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect><rect x="14" y="16" width="7" height="5" rx="1"></rect></svg></span>Coleção
    </a>
    <a href="InsercaoRapida.dc.html" aria-label="Adicionar item" style="justify-self: center; width: 56px; height: 56px; border-radius: 28px; background: #8b6cf5; color: #100d16; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 6px 18px rgba(139,108,245,0.4)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="Series.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #a89cc4; font-size: 11px; font-weight: 500">
      <span style="display: flex; padding: 4px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"></path><path d="m3 13 9 5 9-5"></path></svg></span>Séries
    </a>
    <a href="Desejos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; text-decoration: none; color: #a89cc4; font-size: 11px; font-weight: 500">
      <span style="display: flex; padding: 4px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></span>Desejos
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var base = '#2a3b34';
    var solid = '1px solid rgba(255,255,255,0.08)';
    var wish = '2px dashed #e0912a';
    var mk = function (vol, estado, cor) {
      return {
        titulo: 'Vagabond', serie: 'Vagabond', vol: vol, cor: cor || base,
        lido: estado === 'lido', desejo: estado === 'desejo',
        borda: estado === 'desejo' ? wish : solid,
        op: estado === 'desejo' ? 0.6 : 1
      };
    };
    return {
      itens: [
        mk(1, 'lido', '#2a3b34'), mk(2, 'lido', '#263a3e'), mk(3, 'lido', '#2d3a2a'),
        mk(4, 'desejo', '#1b1726'), mk(5, 'lido', '#33392a'), mk(6, 'lido', '#2a3442'),
        mk(7, 'comprado', '#3b3626'), mk(8, 'comprado', '#2a3b34'), mk(9, 'comprado', '#3a2f2a'),
        mk(10, 'comprado', '#263a3e'), mk(11, 'comprado', '#2d3a2a'), mk(12, 'comprado', '#33392a')
      ]
    };
  }
}
</script>
</body>
</html>
