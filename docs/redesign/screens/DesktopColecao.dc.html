<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Coleção (desktop) — Minha Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="min-height: 900px; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #2b2540; background: #14111d; display: flex; flex-direction: column; gap: 20px">
    <div style="padding: 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Minha Coleção</div>
    <a href="DesktopInsercaoRapida.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 12px; background: #8b6cf5; color: #100d16; text-decoration: none; font-weight: 700; font-size: 15px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Adicionar item</a>
    <nav aria-label="Navegação principal" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DesktopInicio.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>
      <a href="DesktopColecao.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: rgba(139,108,245,0.18); color: #f1eef7; text-decoration: none; font-weight: 600; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="10" rx="1"></rect><rect x="14" y="3" width="7" height="10" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect><rect x="14" y="16" width="7" height="5" rx="1"></rect></svg>Coleção<span style="margin-left: auto; font-size: 12px; font-weight: 500">248</span></a>
      <a href="DesktopSeries.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"></path><path d="m3 13 9 5 9-5"></path></svg>Séries<span style="margin-left: auto; font-size: 12px">31</span></a>
      <a href="DesktopDesejos.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>Desejos<span style="margin-left: auto; font-size: 12px">12</span></a>
    </nav>
    <div style="height: 1px; background: #2b2540"></div>
    <nav aria-label="Ferramentas" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DesktopTags.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path><circle cx="8" cy="8" r="1.5"></circle></svg>Tags</a>
      <a href="DesktopImportar.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #a89cc4; text-decoration: none; font-size: 15px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg>Importar CSV</a>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #1b1726; border: 1px solid #2b2540; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 13px">CM</span>
      <span style="font-size: 14px; color: #a89cc4">Minha conta</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 40px 40px">
    <div style="max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; justify-content: space-between">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Coleção <span style="font-size: 18px; font-weight: 600; color: #a89cc4">248 itens</span></h1>
        <div style="display: flex; gap: 8px">
          <button aria-label="Ver em grade" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #8b6cf5; background: rgba(139,108,245,0.16); color: #f1eef7; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg></button>
          <button aria-label="Ver em lista" aria-pressed="false" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2b2540; background: #14111d; color: #a89cc4; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"></path></svg></button>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; background: #14111d; border: 1px solid #2b2540">
        <label style="flex: 1 1 280px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 10px; background: #1b1726; border: 1px solid #2b2540; color: #a89cc4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar na coleção</span>
          <input type="search" placeholder="Buscar título, série, autor…" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; color: #f1eef7; font: inherit; font-size: 15px; outline: none">
        </label>
        <div role="group" aria-label="Tipo" style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #100d16; border: 1px solid #2b2540">
          <button aria-pressed="true" style="height: 36px; padding: 0 16px; border: 0; border-radius: 7px; background: #f1eef7; color: #100d16; font: inherit; font-size: 14px; font-weight: 600">Todos</button>
          <button aria-pressed="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 7px; background: transparent; color: #a89cc4; font: inherit; font-size: 14px">HQ</button>
          <button aria-pressed="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 7px; background: transparent; color: #a89cc4; font: inherit; font-size: 14px">Mangá</button>
        </div>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8b6cf5; background: rgba(139,108,245,0.16); color: #f1eef7; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 6px">Série: Vagabond
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 14px">Tags ▾</button>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 14px">Estado ▾</button>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 14px">Ordenar: nº ▾</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); column-gap: 18px; row-gap: 20px">
        <sc-for list="{{itens}}" as="c" hint-placeholder-count="14">
          <a href="DesktopItem.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #f1eef7; opacity: {{c.op}}">
            <div style="position: relative; aspect-ratio: 2 / 3; border-radius: 8px; background: {{c.cor}}; border: {{c.borda}}; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; justify-content: flex-end">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; line-height: 1.05">Vagabond</span>
              <sc-if value="{{c.lido}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; background: #d16a5c; color: #100d16">Lido</span>
              </sc-if>
              <sc-if value="{{c.desejo}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; background: #e0912a; color: #100d16">Desejo</span>
              </sc-if>
            </div>
            <div style="font-size: 14px; line-height: 1.3"><span style="font-weight: 600">#{{c.vol}}</span> <span style="color: #a89cc4">Vagabond</span></div>
          </a>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var cores = ['#2a3b34', '#263a3e', '#2d3a2a', '#33392a', '#2a3442', '#3b3626', '#3a2f2a'];
    var itens = [];
    for (var n = 1; n <= 14; n++) {
      var estado = n === 4 ? 'desejo' : (n <= 9 ? 'lido' : 'comprado');
      itens.push({
        vol: n,
        cor: estado === 'desejo' ? '#1b1726' : cores[n % cores.length],
        lido: estado === 'lido', desejo: estado === 'desejo',
        borda: estado === 'desejo' ? '2px dashed #e0912a' : '1px solid rgba(255,255,255,0.08)',
        op: estado === 'desejo' ? 0.6 : 1
      });
    }
    return { itens: itens };
  }
}
</script>
</body>
</html>
