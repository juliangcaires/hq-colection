<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Desejos — Opção A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="min-height: 1000px; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #2b2540; background: #14111d; display: flex; flex-direction: column; gap: 16px">
    <div style="padding: 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Minha Coleção</div>
    <button style="height: 44px; border-radius: 12px; border: 0; background: #8b6cf5; color: #100d16; font: inherit; font-weight: 700; font-size: 15px">+ Adicionar item</button>
    <nav aria-label="Navegação principal" style="display: flex; flex-direction: column; gap: 2px; font-size: 15px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
        <a href="#" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 10px; color: {{n.cor}}; background: {{n.fundo}}; font-weight: {{n.peso}}; text-decoration: none">{{n.nome}}</a>
      </sc-for>
    </nav>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 40px 40px">
    <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Desejos</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px">
          <span style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px dashed #e0912a; color: #f0c48a; display: inline-flex; align-items: center; gap: 6px"><strong style="font-family: 'Bricolage Grotesque', sans-serif">160</strong> itens</span>
          <span style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2b2540; color: #a89cc4; display: inline-flex; align-items: center">Total R$ 0,00 · <a href="#" style="margin-left: 4px">adicionar preços</a></span>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border-radius: 14px; background: #14111d; border: 1px solid #2b2540">
        <label style="flex: 1 1 240px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; background: #1b1726; border: 1px solid #4e4569; color: #a89cc4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar</span>
          <input type="search" placeholder="Buscar por título…" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; color: #f1eef7; font: inherit; font-size: 15px; outline: none">
        </label>
        <div role="group" aria-label="Tipo" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #100d16; border: 1px solid #2b2540">
          <button aria-pressed="true" style="height: 38px; padding: 0 14px; border: 0; border-radius: 7px; background: #f1eef7; color: #100d16; font: inherit; font-size: 14px; font-weight: 600">Todos</button>
          <button aria-pressed="false" style="height: 38px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #a89cc4; font: inherit; font-size: 14px">HQ</button>
          <button aria-pressed="false" style="height: 38px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #a89cc4; font: inherit; font-size: 14px">Mangá</button>
        </div>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 14px">Filtros (tags) ▾</button>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 14px">Ordenar: Prioridade ▾</button>
        <button style="height: 44px; padding: 0 14px; border: 0; background: transparent; color: #b9a6ff; font: inherit; font-size: 14px; font-weight: 600">Selecionar</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px 16px">
        <sc-for list="{{itens}}" as="d" hint-placeholder-count="14">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <a href="#" style="position: relative; display: block; aspect-ratio: 2 / 3; border-radius: 8px; border: 2px dashed #e0912a; box-sizing: border-box; background: {{d.cor}}; text-decoration: none">
              <span style="position: absolute; left: 8px; bottom: 8px; right: 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 14px; line-height: 1.05; color: rgba(241,238,247,0.8)">{{d.capa}}</span>
              <sc-if value="{{d.temPrio}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: #e0912a; color: #100d16">Prio {{d.prio}}</span>
              </sc-if>
            </a>
            <div style="min-width: 0">
              <div style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.titulo}}</div>
              <div style="font-size: 12px; color: #a89cc4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.serie}}</div>
            </div>
            <button style="height: 36px; border-radius: 9px; border: 1px solid rgba(47,191,154,0.6); background: transparent; color: #5fd8b6; font: inherit; font-size: 13px; font-weight: 600">Adquiri</button>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var navNomes = ['Início', 'Feed', 'Coleção', 'Séries', 'Desejos', 'Ranking', 'Diário', 'Estatísticas', 'Listas'];
    var cores = ['#4b1f22', '#1b2a2f', '#2d3a2a', '#3b3626', '#1f3550', '#3a2350', '#5a2a1a', '#263a3e'];
    var base = [
      ['One Piece #32', 'One Piece', 'One Piece'], ['Black Orion', 'Avulso', 'Black Orion'],
      ['Tartarugas Ninja IDW #4', 'Tartarugas Ninja IDW', 'TMNT'], ['Invencível #20', 'Invencível', 'Invencível'],
      ['One Piece #33', 'One Piece', 'One Piece'], ['Invencível #21', 'Invencível', 'Invencível'],
      ['Saga #7', 'Saga', 'Saga'], ['Chainsaw Man #9', 'Chainsaw Man', 'Chainsaw Man'],
      ['Vagabond #4', 'Vagabond', 'Vagabond'], ['Monster #3', 'Monster', 'Monster'],
      ['Hellboy #4', 'Hellboy', 'Hellboy'], ['Tartarugas Ninja IDW #5', 'Tartarugas Ninja IDW', 'TMNT'],
      ['Berserk #16', 'Berserk', 'Berserk'], ['Sandman Vol. 4', 'Sandman', 'Sandman']
    ];
    return {
      nav: navNomes.map(function (n) {
        var a = n === 'Desejos';
        return { nome: n, cor: a ? '#f1eef7' : '#a89cc4', fundo: a ? 'rgba(139,108,245,0.18)' : 'transparent', peso: a ? 600 : 400 };
      }),
      itens: base.map(function (b, i) {
        return { titulo: b[0], serie: b[1], capa: b[2], cor: cores[i % cores.length], temPrio: i < 2, prio: 2 - i };
      })
    };
  }
}
</script>
</body>
</html>
