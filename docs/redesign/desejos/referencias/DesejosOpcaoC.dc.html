<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Desejos — Opção C</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100d16}
a{color:#b9a6ff}a:hover{color:#d4c8ff}
</style>
</helmet>
<div style="min-height: 1000px; background: #100d16; color: #f1eef7; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #2b2540; background: #14111d; display: flex; flex-direction: column; gap: 16px">
    <div style="padding: 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Minha Coleção</div>
    <button style="height: 44px; border-radius: 12px; border: 0; background: #8b6cf5; color: #100d16; font: inherit; font-weight: 700; font-size: 15px">+ Adicionar item</button>
    <nav aria-label="Navegação principal" style="display: flex; flex-direction: column; gap: 2px; font-size: 15px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
        <a href="#" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 10px; color: {{n.cor}}; background: {{n.fundo}}; font-weight: {{n.peso}}; text-decoration: none">{{n.nome}}</a>
      </sc-for>
    </nav>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 40px 40px">
    <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Desejos</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px">
          <span style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px dashed #e0912a; color: #f0c48a; display: inline-flex; align-items: center; gap: 6px"><strong style="font-family: 'Bricolage Grotesque', sans-serif">160</strong> itens em <strong style="font-family: 'Bricolage Grotesque', sans-serif">23</strong> séries</span>
          <span style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2b2540; color: #a89cc4; display: inline-flex; align-items: center">Total R$ 0,00 · <a href="#" style="margin-left: 4px">adicionar preços</a></span>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border-radius: 14px; background: #14111d; border: 1px solid #2b2540">
        <label style="flex: 1 1 240px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; background: #1b1726; border: 1px solid #4e4569; color: #a89cc4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar</span>
          <input type="search" placeholder="Buscar por título ou série…" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; color: #f1eef7; font: inherit; font-size: 15px; outline: none">
        </label>
        <div role="group" aria-label="Agrupar" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #100d16; border: 1px solid #2b2540">
          <button aria-pressed="true" style="height: 38px; padding: 0 14px; border: 0; border-radius: 7px; background: #f1eef7; color: #100d16; font: inherit; font-size: 14px; font-weight: 600">Por série</button>
          <button aria-pressed="false" style="height: 38px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #a89cc4; font: inherit; font-size: 14px">Tudo</button>
        </div>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 14px">HQ / Mangá ▾</button>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2b2540; background: transparent; color: #f1eef7; font: inherit; font-size: 14px">Filtros (tags) ▾</button>
        <button style="height: 44px; padding: 0 14px; border: 0; background: transparent; color: #b9a6ff; font: inherit; font-size: 14px; font-weight: 600">Selecionar</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 16px; align-items: start">
        <sc-for list="{{grupos}}" as="g" hint-placeholder-count="6">
          <section style="padding: 14px 16px 16px; border-radius: 16px; background: #14111d; border: 1px solid #2b2540; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: center; gap: 10px">
              <a href="#" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; color: #f1eef7; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.serie}}</a>
              <span style="flex: none; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{g.tipoCor}}; border: 1px solid {{g.tipoCor}}; border-radius: 4px; padding: 0 5px">{{g.tipo}}</span>
              <span style="flex: 1; font-size: 13px; color: #f0c48a; white-space: nowrap">{{g.resumo}}</span>
              <button style="flex: none; height: 36px; padding: 0 10px; border: 0; background: transparent; color: #b9a6ff; font: inherit; font-size: 13px; font-weight: 600">Ver série</button>
            </div>
            <div style="display: flex; gap: 12px; overflow: hidden">
              <sc-for list="{{g.vols}}" as="v" hint-placeholder-count="4">
                <div style="flex: 0 0 96px; display: flex; flex-direction: column; gap: 6px">
                  <a href="#" aria-label="{{g.serie}} {{v.n}}" style="position: relative; display: block; aspect-ratio: 2 / 3; border-radius: 6px; border: 2px dashed #e0912a; box-sizing: border-box; background: {{g.cor}}">
                    <span style="position: absolute; left: 5px; bottom: 5px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 14px; background: rgba(16,13,22,0.75); border-radius: 3px; padding: 0 5px">{{v.n}}</span>
                  </a>
                  <button style="height: 32px; border-radius: 8px; border: 1px solid rgba(47,191,154,0.6); background: transparent; color: #5fd8b6; font: inherit; font-size: 12px; font-weight: 600">Adquiri</button>
                </div>
              </sc-for>
              <sc-if value="{{g.mais}}" hint-placeholder-val="{{ false }}">
                <a href="#" style="flex: 0 0 96px; aspect-ratio: 2 / 3; border-radius: 6px; border: 1px solid #2b2540; display: flex; align-items: center; justify-content: center; color: #b9a6ff; font-size: 14px; font-weight: 600; text-decoration: none">{{g.maisTxt}}</a>
              </sc-if>
            </div>
          </section>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var navNomes = ['Início', 'Feed', 'Coleção', 'Séries', 'Desejos', 'Ranking', 'Diário', 'Estatísticas', 'Listas'];
    var mk = function (serie, tipo, cor, nums, total) {
      var mostra = nums.slice(0, 4);
      var resto = total - mostra.length;
      return {
        serie: serie, tipo: tipo, cor: cor,
        tipoCor: tipo === 'Mangá' ? '#d98ae3' : '#8fb4f0',
        resumo: total === 1 ? '1 desejo' : total + ' desejos',
        vols: mostra.map(function (n) { return { n: n }; }),
        mais: resto > 0, maisTxt: '+' + resto
      };
    };
    return {
      nav: navNomes.map(function (n) {
        var a = n === 'Desejos';
        return { nome: n, cor: a ? '#f1eef7' : '#a89cc4', fundo: a ? 'rgba(139,108,245,0.18)' : 'transparent', peso: a ? 600 : 400 };
      }),
      grupos: [
        mk('One Piece', 'Mangá', '#4b1f22', ['#32', '#33', '#34', '#35'], 12),
        mk('Invencível', 'HQ', '#3b3626', ['#20', '#21', '#22'], 3),
        mk('Tartarugas Ninja IDW', 'HQ', '#2d3a2a', ['#4', '#5', '#6', '#7'], 9),
        mk('Chainsaw Man', 'Mangá', '#5a2a1a', ['#9', '#10'], 2),
        mk('Vagabond', 'Mangá', '#263a3e', ['#4', '#17', '#22'], 3),
        mk('Avulsos', 'HQ', '#1b2a2f', ['Black Orion', 'Hellboy 4', 'Sandman 4'], 3)
      ]
    };
  }
}
</script>
</body>
</html>
